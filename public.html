<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>MySpace Schedule</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#182238;background:#f3f6fb;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fb}.topbar{background:#172554;color:#fff;box-shadow:0 2px 8px #0f172a18}.topbar-inner{max-width:820px;margin:auto;padding:22px 20px;display:flex;align-items:center;gap:16px}h1{margin:0;font-size:27px;line-height:1.2;font-weight:750;letter-spacing:-.4px}main{width:min(100% - 32px,780px);margin:25px auto 44px;text-align:center}.date-panel{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;margin-bottom:18px;background:#fff;border:1px solid #dce4f0;border-radius:15px;box-shadow:0 3px 12px #17255408}.date-copy{min-width:0;flex:1;text-align:center}.eyebrow{margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.09em;color:#71809a}.date-input{width:100%;min-width:0;padding:5px 0;border:0;outline:0;color:#182238;background:transparent;font:inherit;font-size:16px;font-weight:650;text-align:center}.section-heading{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 2px 10px}h2{margin:0;font-size:17px;font-weight:750}.refresh{border:1px solid #d5deeb;border-radius:9px;padding:8px 12px;background:#fff;color:#1e40af;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.refresh:disabled{opacity:.55;cursor:wait}.column-head{display:grid;grid-template-columns:116px minmax(0,1fr) 112px;align-items:center;gap:10px;padding:0 16px 8px;color:#8290a6;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.column-head span{text-align:center}.rows{display:grid;gap:9px}.slot{display:grid;grid-template-columns:116px minmax(0,1fr) 112px;align-items:center;gap:10px;min-height:66px;padding:13px 16px;background:#fff;border:1px solid #dce4f0;border-radius:13px;box-shadow:0 2px 8px #17255406}.time{color:#56657d;font-size:12px;line-height:1.45;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}.topic{min-width:0;text-align:center;font-size:15px;line-height:1.35;font-weight:750;overflow-wrap:anywhere}.status-wrap{display:flex;justify-content:center}.status{display:inline-flex;align-items:center;justify-content:center;min-width:88px;padding:7px 9px;border-radius:999px;font-size:10px;line-height:1;font-weight:850;letter-spacing:.035em;white-space:nowrap}.available{color:#137443;background:#e7f8ee}.busy{color:#b42332;background:#fff0f0}.message{padding:26px 18px;text-align:center;color:#687790;background:#fff;border:1px dashed #cbd5e1;border-radius:13px;font-size:14px;line-height:1.5}.footnote{margin:14px 3px 0;color:#8591a5;font-size:11px;line-height:1.5;text-align:center}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}@media(max-width:520px){.topbar-inner{padding:19px 17px}h1{font-size:25px}main{width:calc(100% - 22px);margin-top:16px}.date-panel{padding:13px;border-radius:12px;justify-content:center;text-align:center}.date-input{font-size:14px}.column-head,.slot{grid-template-columns:91px minmax(0,1fr) 82px;gap:5px}.column-head{padding:0 10px 8px;font-size:9px;letter-spacing:.04em}.slot{min-height:62px;padding:12px 9px;border-radius:11px}.time{font-size:10px;letter-spacing:-.15px}.topic{font-size:13px}.status{min-width:75px;padding:7px 5px;font-size:9px}}@media(max-width:350px){.column-head,.slot{grid-template-columns:79px minmax(0,1fr) 73px;gap:4px}.slot{padding-left:7px;padding-right:7px}.time{font-size:9px}.topic{font-size:12px}.status{min-width:69px;font-size:8px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><h1>MySpace</h1></div></header>
<main>
<section class="date-panel" aria-label="Choose schedule date"><div class="date-copy"><p class="eyebrow">DAILY SCHEDULE</p><input class="date-input" id="scheduleDate" type="date" aria-label="Choose schedule date"></div></section>
<div class="section-heading"><h2>Schedule</h2><button class="refresh" id="refreshBtn" type="button">↻ Refresh</button></div>
<div class="column-head" aria-hidden="true"><span>Time</span><span>Activity / Person</span><span>Status</span></div>
<div id="scheduleRows" class="rows" aria-live="polite"><div class="message">Loading schedule…</div></div>
<p class="footnote">Schedule is loaded from Google Sheets.</p>
</main>
<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbwvo4U_AKJUvXP_DPyZnRP8akMRHHhM94QyXzhrdEvNtYKapw2nmsJ-YSc12u34nW3O/exec';
const dateInput = document.getElementById('scheduleDate');
const rowsEl = document.getElementById('scheduleRows');
const refreshBtn = document.getElementById('refreshBtn');
function localDateString(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTime(v){const m=/^(\d{2}):(\d{2})$/.exec(v||'');if(!m)return v||'';let h=Number(m[1]);const ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+m[2]+' '+ap;}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='mySpaceCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();};const timer=setTimeout(()=>{cleanup();reject(new Error('API request timed out. Check the Apps Script deployment and API URL.'));},15000);window[cb]=data=>{cleanup();resolve(data);};script.onerror=()=>{cleanup();reject(new Error('Could not reach the API. Check the deployment URL and access settings.'));};script.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();document.head.appendChild(script);});}
function renderRows(rows){if(!Array.isArray(rows)||!rows.length){rowsEl.innerHTML='<div class="message">No schedule entries for this date.</div>';return;}rows=[...rows].sort((a,b)=>String(a.start||'').localeCompare(String(b.start||''))||String(a.end||'').localeCompare(String(b.end||''))||String(a.topic||'').localeCompare(String(b.topic||'')));rowsEl.innerHTML=rows.map(row=>{const status=String(row.status||'').toUpperCase();const available=status==='AVAILABLE';return `<article class="slot"><div class="time">${escapeHtml(formatTime(row.start))}<br>– ${escapeHtml(formatTime(row.end))}</div><div class="topic">${escapeHtml(row.topic)}</div><div class="status-wrap"><span class="status ${available?'available':'busy'}">${escapeHtml(status||'UNKNOWN')}</span></div></article>`;}).join('');}
async function loadSchedule(){const date=dateInput.value;if(!date)return;rowsEl.innerHTML='<div class="message">Loading schedule…</div>';refreshBtn.disabled=true;try{const result=await jsonp({action:'publicList',date});if(!result||result.ok!==true)throw new Error(result&&result.error?result.error:'Unexpected API response.');renderRows(result.entries||[]);}catch(err){rowsEl.innerHTML='<div class="message">'+escapeHtml(err.message||'Could not load schedule.')+'</div>';}finally{refreshBtn.disabled=false;}}
dateInput.value=localDateString();dateInput.addEventListener('change',loadSchedule);refreshBtn.addEventListener('click',loadSchedule);loadSchedule();
</script>
</body>
</html>
