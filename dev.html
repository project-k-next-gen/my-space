<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeSpace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#090b0f;
--panel:#0e1117;
--panel2:#12161d;
--editor:#0a0d12;
--border:#242a33;
--border2:#343c48;
--text:#e7edf4;
--muted:#7d8794;
--accent:#3b82f6;
--danger:#ef4444;
--success:#22c55e
}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex}
.sidebar{width:255px;min-width:255px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px}
.brandMark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800}
.brandName{font-size:15px;font-weight:700}
.sideHeader{height:44px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em}
.add{width:27px;height:27px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:19px}
.add:hover{background:#202630;color:#fff}
.list{padding:0 7px;overflow:auto}
.item{height:34px;padding:0 9px;border-radius:6px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.item:hover{background:#191e26;color:#fff}
.item.active{background:#3b82f615;color:#79b8ff}
.itemIcon{width:16px;text-align:center}
.emptySide{padding:20px 12px;color:#555f6d;font-size:11px;text-align:center;line-height:1.6}
.sidebarBottom{margin-top:auto;border-top:1px solid var(--border);padding:7px}
.sideButton{height:34px;padding:0 9px;border-radius:6px;color:var(--muted);display:flex;align-items:center;gap:9px;font-size:11px;cursor:pointer}
.sideButton:hover{background:#191e26;color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;min-height:58px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.left{display:flex;align-items:center;gap:10px;min-width:0}
.menu{display:none;width:31px;height:31px;border:1px solid var(--border);background:#171c24;color:var(--muted);border-radius:6px}
.path{font-size:12px;display:flex;gap:8px;min-width:0;overflow:hidden}
.pathProject{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pathFile{color:var(--text);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px}
.btn{height:32px;padding:0 11px;border:1px solid var(--border2);border-radius:6px;background:#181e26;color:var(--text);font-size:11px}
.btn:hover{background:#232a34}
.save{background:var(--success);border-color:var(--success);color:#fff}
.run{background:var(--accent);border-color:var(--accent);color:#fff}
.danger{background:#ef444415;border-color:#ef444455;color:#ff7770}
.workspace{flex:1;min-height:0;display:flex}
.editorPanel{width:55%;min-width:300px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--editor)}
.tabs{height:40px;min-height:40px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;overflow:auto}
.tab{height:40px;padding:0 13px;border:0;border-right:1px solid var(--border);background:transparent;color:var(--muted);font:11px monospace;white-space:nowrap}
.tab:hover{background:#191e26;color:#fff}
.tab.active{background:var(--editor);color:#fff;box-shadow:inset 0 2px var(--accent)}
.editor{flex:1;min-height:0;display:flex}
.lines{width:50px;min-width:50px;padding:13px 9px 13px 0;color:#434b56;text-align:right;font:12px/1.65 monospace;overflow:hidden;user-select:none}
#code{flex:1;width:100%;height:100%;border:0;outline:0;resize:none;background:var(--editor);color:#d4dbe3;padding:13px 15px;font:12px/1.65 Consolas,monospace;white-space:pre;overflow:auto;tab-size:2}
.resizer{width:5px;cursor:col-resize;background:transparent}
.resizer:hover{background:var(--accent)}
.preview{flex:1;min-width:250px;display:flex;flex-direction:column;background:#fff}
.previewHead{height:40px;min-height:40px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--muted);font-size:10px;font-weight:700}
.previewActions{display:flex;gap:3px}
.previewActions button{border:0;background:transparent;color:var(--muted);height:27px;padding:0 8px;border-radius:5px;font-size:10px}
.previewActions button:hover{background:#202630;color:#fff}
.previewBody{flex:1;min-height:0;display:flex;justify-content:center;background:#e5e7eb;overflow:auto}
#preview{border:0;background:#fff;width:100%;height:100%}
.status{height:26px;min-height:26px;border-top:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--muted);font-size:9px}
.statusDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:5px}
.modalLayer,.menuLayer{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
.modalLayer.show,.menuLayer.show{display:flex}
.modal{width:min(400px,calc(100% - 30px));background:#151a21;border:1px solid var(--border2);border-radius:10px;box-shadow:0 25px 80px #000b;padding:19px}
.modal h2{font-size:15px}
.modal p{font-size:10px;color:var(--muted);margin:5px 0 14px}
.input{width:100%;height:39px;background:#0b0e13;border:1px solid var(--border2);border-radius:6px;color:#fff;padding:0 10px;font-size:12px;outline:0}
.input:focus{border-color:var(--accent)}
.modalButtons{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.context{position:absolute;width:175px;background:#151a21;border:1px solid var(--border2);border-radius:7px;padding:5px;box-shadow:0 15px 45px #0009}
.contextItem{height:32px;border-radius:5px;display:flex;align-items:center;padding:0 9px;color:#aab2bd;font-size:11px}
.contextItem:hover{background:#232a34;color:#fff}
.contextItem.delete:hover{background:#ef444415;color:#ff7770}
.centerEmpty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:var(--muted)}
.centerIcon{width:52px;height:52px;border:1px solid var(--border2);border-radius:14px;display:grid;place-items:center;font-size:20px;margin-bottom:14px;background:#11161d}
.centerEmpty h2{font-size:15px;color:var(--text);font-weight:650}
.centerEmpty p{font-size:11px;margin-top:6px;max-width:280px;line-height:1.6}
.centerAction{margin-top:15px;height:34px;padding:0 13px;background:var(--accent);border:1px solid var(--accent);border-radius:6px;color:#fff;font-size:11px}
.settings{position:fixed;right:0;top:0;height:100%;width:330px;background:#11161d;border-left:1px solid var(--border);z-index:60;transform:translateX(100%);transition:.2s}
.settings.open{transform:translateX(0)}
.settingsHead{height:58px;padding:0 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.settingsHead strong{font-size:14px}
.close{border:0;background:transparent;color:var(--muted);font-size:21px}
.settingsBody{padding:15px}
.setting{padding:11px 0;border-bottom:1px solid #ffffff08;display:flex;align-items:center;justify-content:space-between}
.setting span{font-size:11px}
.setting select,.setting input[type=number]{height:30px;background:#0b0f14;color:#fff;border:1px solid var(--border2);border-radius:5px;padding:0 7px;font-size:10px}
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(15px);background:#151a21;border:1px solid var(--border2);box-shadow:0 12px 35px #0008;color:#fff;padding:9px 13px;border-radius:7px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){
.sidebar{position:absolute;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:.2s}
.sidebar.open{transform:translateX(0)}
.menu{display:block}
.preview{display:none}
.editorPanel{width:100%;min-width:0}
.resizer{display:none}
}
</style>
</head>
<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="brand">
<div class="brandMark">&lt;/&gt;</div>
<div class="brandName">CodeSpace</div>
</div>

<div class="sideHeader">
<span>PROJECTS</span>
<button class="add" id="newProject">+</button>
</div>

<div class="list" id="projectList"></div>

<div class="sideHeader" style="margin-top:10px">
<span id="fileTitle">FILES</span>
<button class="add" id="newFile">+</button>
</div>

<div class="list" id="fileList"></div>

<div class="sidebarBottom">
<div class="sideButton" id="settingsButton">⚙ Settings</div>
</div>

</aside>

<main class="main">

<header class="topbar">

<div class="left">
<button class="menu" id="menu">☰</button>

<div class="path">
<span class="pathProject" id="projectName"></span>
<span id="pathSeparator" style="color:#4b5563"></span>
<strong class="pathFile" id="fileName"></strong>
</div>

</div>

<div class="actions">
<button class="btn" id="more">⋯</button>
<button class="btn save" id="save">Save</button>
<button class="btn run" id="run">Run</button>
</div>

</header>

<section class="workspace">

<div class="editorPanel" id="editorPanel">

<div class="tabs" id="tabs"></div>

<div class="editor" id="editorArea">

<div class="lines" id="lines"></div>

<textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>

</div>

<div class="centerEmpty" id="editorEmpty">

<div class="centerIcon">⌘</div>

<h2>No file selected</h2>

<p>Create or select a file to start working.</p>

<button class="centerAction" id="emptyFile">Create File</button>

</div>

</div>

<div class="resizer" id="resizer"></div>

<div class="preview">

<div class="previewHead">

<span>PREVIEW</span>

<div class="previewActions">
<button data-device="desktop">Desktop</button>
<button data-device="tablet">Tablet</button>
<button data-device="mobile">Mobile</button>
<button id="refresh">↻</button>
</div>

</div>

<div class="previewBody">
<iframe id="preview" sandbox="allow-scripts"></iframe>
</div>

</div>

</section>

<footer class="status">
<span><span class="statusDot"></span><span id="status">Ready</span></span>
<span id="position"></span>
</footer>

</main>
</div>

<div class="modalLayer" id="modalLayer">

<div class="modal">

<h2 id="modalTitle"></h2>

<p id="modalDescription"></p>

<input class="input" id="modalInput" autocomplete="off">

<div class="modalButtons">
<button class="btn" id="modalCancel">Cancel</button>
<button class="btn run" id="modalConfirm">Create</button>
</div>

</div>

</div>

<div class="menuLayer" id="contextLayer"></div>

<aside class="settings" id="settings">

<div class="settingsHead">
<strong>Settings</strong>
<button class="close" id="closeSettings">×</button>
</div>

<div class="settingsBody">

<div class="setting">
<span>Font Size</span>
<input type="number" id="fontSize" min="10" max="24">
</div>

<div class="setting">
<span>Tab Size</span>
<select id="tabSize">
<option value="2">2</option>
<option value="4">4</option>
<option value="8">8</option>
</select>
</div>

<div class="setting">
<span>Theme</span>
<select id="theme">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="light">Light</option>
</select>
</div>

<div class="setting">
<span>Auto Run</span>
<input type="checkbox" id="autoRun">
</div>

<div class="setting">
<span>Line Numbers</span>
<input type="checkbox" id="lineNumbers">
</div>

<div class="setting">
<span>Word Wrap</span>
<input type="checkbox" id="wordWrap">
</div>

</div>
</aside>

<div class="toast" id="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzadukuKham7ZkvSIFbS5Xj7nhzH53LVZat7lRKSLEpMQygnmVJxonFwaEPy7LFBLGg/exec";

const state={
projects:[],
currentProject:null,
currentFile:null,
settings:{
fontSize:12,
tabSize:2,
theme:"dark",
autoRun:false,
lineNumbers:true,
wordWrap:false
}
};

const $=id=>document.getElementById(id);

let modalAction=null;
let resizeActive=false;
let toastTimer=null;
let saveTimer=null;

function status(text){
$("status").textContent=text;
}

function toast(message){
const el=$("toast");
el.textContent=message;
el.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>{
el.classList.remove("show");
},2200);
}

function persist(){
try{
localStorage.setItem(
"codespace_v4",
JSON.stringify({
projects:state.projects,
currentProject:state.currentProject,
currentFile:state.currentFile,
settings:state.settings
})
);
}catch(e){}
}

function restore(){
try{
const saved=JSON.parse(
localStorage.getItem("codespace_v4")
);

if(!saved)return;

if(Array.isArray(saved.projects)){
state.projects=saved.projects;
}

if(saved.currentProject){
state.currentProject=saved.currentProject;
}

if(saved.currentFile){
state.currentFile=saved.currentFile;
}

if(saved.settings){
state.settings={
...state.settings,
...saved.settings
};
}

}catch(e){}
}

function projectFiles(){
const project=state.projects.find(
x=>x.id===state.currentProject
);

return project
?project.files||[]
:[];
}

function currentFile(){
return projectFiles().find(
x=>x.id===state.currentFile
)||null;
}

function escape(value){
return String(value).replace(
/[&<>"']/g,
x=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[x])
);
}

function fileIcon(name){
const n=name.toLowerCase();

if(n.endsWith(".html")||n.endsWith(".htm"))return"◇";
if(n.endsWith(".css"))return"◆";
if(n.endsWith(".js")||n.endsWith(".mjs"))return"◈";
if(n.endsWith(".json"))return"{}";
if(n.endsWith(".md"))return"≡";

return"○";
}

function renderProjects(){

const box=$("projectList");

box.innerHTML="";

if(!state.projects.length){

box.innerHTML=
'<div class="emptySide">No projects yet.<br>Create one to begin.</div>';

return;
}

state.projects.forEach(project=>{

const el=document.createElement("div");

el.className=
"item"+
(project.id===state.currentProject?" active":"");

el.innerHTML=
`<span class="itemIcon">▰</span><span>${escape(project.name)}</span>`;

el.onclick=()=>{
state.currentProject=project.id;
state.currentFile=
project.files?.[0]?.id||null;
render();
};

el.oncontextmenu=e=>{
e.preventDefault();
openContext(
e.clientX,
e.clientY,
"project",
project.id
);
};

box.appendChild(el);

});
}

function renderFiles(){

const box=$("fileList");

const files=projectFiles();

box.innerHTML="";

if(!state.currentProject){

$("fileTitle").textContent="FILES";

box.innerHTML=
'<div class="emptySide">Select a project.</div>';

return;
}

$("fileTitle").textContent="FILES";

if(!files.length){

box.innerHTML=
'<div class="emptySide">No files yet.<br>Create a file to begin.</div>';

return;
}

files.forEach(file=>{

const el=document.createElement("div");

el.className=
"item"+
(file.id===state.currentFile?" active":"");

el.innerHTML=
`<span class="itemIcon">${fileIcon(file.name)}</span><span>${escape(file.name)}</span>`;

el.onclick=()=>{
state.currentFile=file.id;
render();
};

el.oncontextmenu=e=>{
e.preventDefault();

openContext(
e.clientX,
e.clientY,
"file",
file.id
);
};

box.appendChild(el);

});
}

function renderTabs(){

const box=$("tabs");

box.innerHTML="";

projectFiles().forEach(file=>{

const tab=document.createElement("button");

tab.className=
"tab"+
(file.id===state.currentFile?" active":"");

tab.textContent=file.name;

tab.onclick=()=>{
state.currentFile=file.id;
render();
};

box.appendChild(tab);

});
}

function renderEditor(){

const file=currentFile();

if(!file){

$("editorArea").style.display="none";
$("editorEmpty").style.display="flex";

const project=
state.projects.find(
x=>x.id===state.currentProject
);

$("projectName").textContent=
project?.name||"";

$("pathSeparator").textContent="";
$("fileName").textContent="";
$("position").textContent="";

return;
}

$("editorArea").style.display="flex";
$("editorEmpty").style.display="none";

const project=
state.projects.find(
x=>x.id===state.currentProject
);

$("projectName").textContent=
project?.name||"";

$("pathSeparator").textContent="/";
$("fileName").textContent=file.name;

$("code").value=file.content||"";

updateLines();
updatePosition();
applySettings();
}

function render(){
renderProjects();
renderFiles();
renderTabs();
renderEditor();
persist();
}

function openModal(
title,
description,
placeholder,
button,
callback,
value=""
){

$("modalTitle").textContent=title;
$("modalDescription").textContent=description;
$("modalInput").placeholder=placeholder;
$("modalInput").value=value;
$("modalConfirm").textContent=button;

$("modalLayer").classList.add("show");

modalAction=callback;

setTimeout(()=>{
$("modalInput").focus();
$("modalInput").select();
},30);
}

function closeModal(){

$("modalLayer").classList.remove("show");

modalAction=null;
}

$("modalConfirm").onclick=()=>{

const value=
$("modalInput").value.trim();

if(!value)return;

const action=modalAction;

closeModal();

if(action){
action(value);
}
};

$("modalCancel").onclick=closeModal;

$("modalInput").onkeydown=e=>{

if(e.key==="Enter"){
e.preventDefault();
$("modalConfirm").click();
}

if(e.key==="Escape"){
closeModal();
}
};

async function api(action,data={}){

const response=await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
action,
...data
})
});

if(!response.ok){
throw new Error(
"HTTP "+response.status
);
}

const result=await response.json();

if(!result.success){
throw new Error(
result.error||"API request failed"
);
}

return result;
}

async function createProject(){

openModal(
"Create Project",
"Choose a name for your project.",
"Project name",
"Create",
async name=>{

status("Creating project...");

try{

const result=
await api(
"createProject",
{
project:{
name:name,
files:[]
}
}
);

const project=result.project;

state.projects.push(project);

state.currentProject=project.id;
state.currentFile=null;

render();

status("Project created");
toast("Project created");

}catch(error){

console.error(error);

status("Create failed");
toast(error.message);

}
}
);
}

async function createFile(){

if(!state.currentProject){

createProject();

return;
}

openModal(
"Create File",
"Add a new file to this project.",
"example.html",
"Create",
async name=>{

status("Creating file...");

try{

const result=
await api(
"createFile",
{
projectId:state.currentProject,
file:{
name:name,
content:""
}
}
);

const project=
state.projects.find(
x=>x.id===state.currentProject
);

if(!project)return;

project.files.push(result.file);

state.currentFile=result.file.id;

render();

status("File created");
toast("File created");

}catch(error){

console.error(error);

status("Create failed");
toast(error.message);

}
}
);
}

async function renameProject(id){

const project=
state.projects.find(
x=>x.id===id
);

if(!project)return;

openModal(
"Rename Project",
"Change the project name.",
"Project name",
"Rename",
async name=>{

status("Renaming project...");

try{

const updated={
id:project.id,
name:name,
files:project.files
};

const result=
await api(
"updateProject",
{
project:updated
}
);

const index=
state.projects.findIndex(
x=>x.id===project.id
);

if(index!==-1){
state.projects[index]=result.project;
}

render();

status("Project renamed");
toast("Project renamed");

}catch(error){

console.error(error);

status("Rename failed");
toast(error.message);

}
},
project.name
);
}

async function renameFile(id){

const project=
state.projects.find(
x=>x.id===state.currentProject
);

const file=
project?.files.find(
x=>x.id===id
);

if(!file)return;

openModal(
"Rename File",
"Change the file name.",
"filename",
"Rename",
async name=>{

status("Renaming file...");

try{

const result=
await api(
"renameFile",
{
projectId:project.id,
fileId:file.id,
name:name
}
);

const index=
project.files.findIndex(
x=>x.id===file.id
);

if(index!==-1){
project.files[index]=result.file;
}

render();

status("File renamed");
toast("File renamed");

}catch(error){

console.error(error);

status("Rename failed");
toast(error.message);

}
},
file.name
);
}

async function duplicateFile(id){

const project=
state.projects.find(
x=>x.id===state.currentProject
);

const file=
project?.files.find(
x=>x.id===id
);

if(!file)return;

status("Duplicating file...");

try{

const result=
await api(
"duplicateFile",
{
projectId:project.id,
fileId:file.id
}
);

project.files.push(result.file);

state.currentFile=result.file.id;

render();

status("File duplicated");
toast("File duplicated");

}catch(error){

console.error(error);

status("Duplicate failed");

}
}

async function deleteProject(id){

const project=
state.projects.find(
x=>x.id===id
);

if(!project)return;

if(!confirm(
`Delete "${project.name}"?`
)){
return;
}

status("Deleting project...");

try{

await api(
"deleteProject",
{
id:project.id
}
);

state.projects=
state.projects.filter(
x=>x.id!==id
);

if(
state.currentProject===id
){

state.currentProject=
state.projects[0]?.id||null;

state.currentFile=
projectFiles()[0]?.id||null;
}

render();

status("Project deleted");
toast("Project deleted");

}catch(error){

console.error(error);

status("Delete failed");
toast(error.message);

}
}

async function deleteFile(id){

const project=
state.projects.find(
x=>x.id===state.currentProject
);

if(!project)return;

const file=
project.files.find(
x=>x.id===id
);

if(!file)return;

if(!confirm(
`Delete "${file.name}"?`
)){
return;
}

status("Deleting file...");

try{

await api(
"deleteFile",
{
projectId:project.id,
fileId:file.id
}
);

project.files=
project.files.filter(
x=>x.id!==id
);

if(state.currentFile===id){

state.currentFile=
project.files[0]?.id||null;
}

render();

status("File deleted");
toast("File deleted");

}catch(error){

status("Delete failed");
toast(error.message);

}
}

project?.files?.[0]?.id||null;

}
],
[

()=>renameProject(id)
],
[
"Delete",
()=>deleteProject(id)
]
]
:[

()=>{
state.currentFile=id;
render();
}
],
[

()=>renameFile(id)
],
[

],

()=>deleteFile(id)
]
];

function updateLines(){

if(!$("code").value){

$("lines").textContent="";

return;
}

const count=
$("code").value
.split("\n")
.length;

$("lines").textContent=
Array.from(
{length:count},
(_,i)=>i+1
).join("\n");
}

function updatePosition(){

const code=$("code");

const pos=code.selectionStart;

const text=
code.value.slice(0,pos);

const line=
text.split("\n").length;

const col=
pos-
(text.lastIndexOf("\n")+1)+1;

$("position").textContent=
`Ln ${line}, Col ${col}`;
}

$("code").addEventListener(
"input",
()=>{

const file=currentFile();

if(!file)return;

file.content=
$("code").value;

updateLines();
updatePosition();

status("Unsaved changes");

persist();

if(state.settings.autoRun){

clearTimeout(
window.autoRunTimer
);

window.autoRunTimer=
setTimeout(
runPreview,
300
);
}

}
);

$("code").addEventListener(
"keyup",
updatePosition
);

$("code").addEventListener(
"click",
updatePosition
);

$("code").addEventListener(
"scroll",
()=>{
$("lines").scrollTop=
$("code").scrollTop;
}
);

$("code").addEventListener(
"keydown",
e=>{

if(e.key==="Tab"){

e.preventDefault();

const spaces=
" ".repeat(
Number(state.settings.tabSize)
);

const start=
$("code").selectionStart;

const end=
$("code").selectionEnd;

$("code").value=
$("code").value.slice(0,start)+
spaces+
$("code").value.slice(end);

$("code").selectionStart=
$("code").selectionEnd=
start+spaces.length;

const file=currentFile();

if(file){
file.content=
$("code").value;
}

updateLines();
updatePosition();
persist();

status("Unsaved changes");
}

if(
(e.ctrlKey||e.metaKey)&&
e.key.toLowerCase()==="s"
){

e.preventDefault();

save();
}

if(
(e.ctrlKey||e.metaKey)&&
e.key==="Enter"
){

e.preventDefault();

runPreview();
}

}
);

async function save(){

const project=
state.projects.find(
x=>x.id===state.currentProject
);

if(!project){

status("Nothing to save");

return;
}

const file=currentFile();

if(file){
file.content=
$("code").value;
}

persist();

await saveToAPI();
}

async function saveToAPI(){

const project=
state.projects.find(
x=>x.id===state.currentProject
);

if(!project){

status("Nothing to save");

return;
}

status("Saving...");

try{

const result=
await api(
"saveProject",
{
project:{
id:project.id,
name:project.name,
files:project.files
}
}
);

if(!result.project){
throw new Error(
"Invalid API response"
);
}

const oldProjectId=
project.id;

const index=
state.projects.findIndex(
x=>x.id===oldProjectId
);

if(index!==-1){

state.projects[index]=
result.project;

state.currentProject=
result.project.id;

const matchingFile=
result.project.files.find(
f=>f.id===state.currentFile
);

if(matchingFile){
state.currentFile=
matchingFile.id;
}else{
state.currentFile=
result.project.files[0]?.id||null;
}

}

persist();

render();

status("Saved");
toast("Saved to Google Drive");

}catch(error){

console.error(
"Save error:",
error
);

status("Save failed");

toast(
"Save failed: "+error.message
);

}
}

async function loadFromAPI(){

status("Connecting...");

try{

const result=
await api(
"listProjects"
);

if(
!Array.isArray(result.projects)
){

throw new Error(
"Invalid project response"
);

}

const previousProject=
state.currentProject;

const previousFile=
state.currentFile;

state.projects=
result.projects;

if(
previousProject &&
state.projects.some(
x=>x.id===previousProject
)
){

state.currentProject=
previousProject;

}else{

state.currentProject=
state.projects[0]?.id||null;

}

const files=projectFiles();

if(
previousFile &&
files.some(
x=>x.id===previousFile
)
){

state.currentFile=
previousFile;

}else{

state.currentFile=
files[0]?.id||null;

}

persist();

render();

status("Connected");
toast("Google Drive connected");

}catch(error){

console.error(
"Load error:",
error
);

status("Offline");

toast(
"Could not connect to Google Drive"
);

}
}

function extractBody(html){

const match=
html.match(
/<body[^>]*>([\s\S]*?)<\/body>/i
);

return match
?match[1]
:html;
}

function extractHead(html){

const match=
html.match(
/<head[^>]*>([\s\S]*?)<\/head>/i
);

return match
?match[1]
:"";
}

function runPreview(){

const project=
state.projects.find(
x=>x.id===state.currentProject
);

if(!project){

$("preview").srcdoc="";

status("Create a project first");

return;
}

const htmlFile=
project.files.find(
x=>/\.html?$/i.test(x.name)
);

const cssFiles=
project.files.filter(
x=>/\.css$/i.test(x.name)
);

const jsFiles=
project.files.filter(
x=>/\.js$/i.test(x.name)
);

if(!htmlFile){

$("preview").srcdoc="";

status("No HTML file to preview");

return;
}

const head=
extractHead(
htmlFile.content||""
);

const body=
extractBody(
htmlFile.content||""
);

const css=
cssFiles
.map(x=>x.content)
.join("\n");

const js=
jsFiles
.map(x=>x.content)
.join("\n")
.replace(
/<\/script>/gi,
"<\\/script>"
);

$("preview").srcdoc=`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
${head}
<style>${css}</style>
</head>
<body>
${body}
<script>${js}<\/script>
</body>
</html>
`;

status("Preview updated");
}

()=>{

window.addEventListener("load", async () => {
  restore();
  applySettings();
  render();

  // Load projects from Google Drive.
  await loadFromAPI();

  // Show the current file in the editor after loading.
  const file = currentFile();

  if (file) {
    $("code").value = file.content || "";
    updateLines();
    updatePosition();
    runPreview();
  }
});

window.addEventListener("resize", () => {
  updateLines();
  updatePosition();
});

// Close the mobile sidebar after selecting a file.
$("fileList").addEventListener("click", () => {
  if (window.innerWidth <= 700) {
    $("sidebar").classList.remove("open");

});

// Close the mobile sidebar after selecting a project.
$("projectList").addEventListener("click", () => {
  if (window.innerWidth <= 700) {
    $("sidebar").classList.remove("open");
  }
});

// Prevent accidental loss of unsaved editor changes.
window.addEventListener("beforeunload", e => {
  const file = currentFile();

  if (file && file.content !== $("code").value) {
    file.content = $("code").value;
    persist();
  }
});
