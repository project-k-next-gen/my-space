<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>MySpace Admin</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172033;background:#f5f7fb;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{background:#172554;color:#fff;padding:21px max(18px,calc((100% - 1000px)/2));display:flex;align-items:center;gap:16px}h1{font-size:25px;margin:0}main{max-width:1000px;margin:0 auto;padding:22px 16px 40px}h2{font-size:18px;margin:0 0 14px}.panel{background:#fff;border:1px solid #dce2ed;border-radius:13px;padding:17px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033}button{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.97)}button:active:not(:disabled){transform:translateY(1px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.primary{background:#1d4ed8;color:#fff}.secondary{background:#e8edf7;color:#172554}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.muted{font-size:12px;color:#64748b}.message{font-size:13px;margin-top:10px;color:#475569;overflow-wrap:anywhere;white-space:pre-wrap}.entry-list{display:grid;gap:9px}.entry{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,1.2fr) minmax(80px,.8fr) auto;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:9px;padding:12px}.entry strong{display:block;overflow-wrap:anywhere}.entry small{color:#64748b}.entry .status{font-size:11px;font-weight:800}.available{color:#15803d}.busy{color:#b91c1c}.hidden{display:none!important}@media(max-width:620px){main{padding:15px 10px 28px}.grid{grid-template-columns:1fr}.entry{grid-template-columns:1fr auto;gap:6px}.entry .topiccol{grid-column:1}.entry .statuscol{grid-column:2;grid-row:1}.entry .rowactions{grid-column:1/-1}.entry .rowactions button{padding:8px 10px}}
</style>
</head>
<body>
<header><h1>MySpace Admin</h1></header>
<main>
<section class="panel" id="authPanel"><h2>Admin authorization</h2><label for="adminCode">Authorization code</label><input id="adminCode" type="password" autocomplete="current-password" placeholder="Enter admin code"><div class="actions"><button class="primary" id="unlockBtn" type="button">Unlock admin page</button></div><div class="message" id="authMessage" role="status"></div><p class="muted">Authorization is verified by the Apps Script backend.</p></section>
<div id="adminWorkspace" class="hidden">
<section class="panel"><h2>Schedule date</h2><div class="grid"><div><label for="listDate">Choose date</label><input type="date" id="listDate"></div><div style="align-self:end"><button class="secondary" id="loadBtn" type="button">Load schedule</button></div></div><div class="message" id="listMessage" role="status"></div></section>
<section class="panel"><h2 id="formTitle">Add schedule row</h2><input type="hidden" id="entryId"><div class="grid"><div><label for="entryDate">Date</label><input type="date" id="entryDate" required></div><div><label for="topic">Activity / person</label><input id="topic" maxlength="120" placeholder="e.g. Studying, Ravi" required></div><div><label for="start">Start time</label><input type="time" id="start" required></div><div><label for="end">End time</label><input type="time" id="end" required></div><div><label for="status">Status</label><select id="status"><option>AVAILABLE</option><option>BUSY</option></select></div></div><div class="actions"><button class="primary" id="saveBtn" type="button">Save schedule row</button><button class="secondary" id="clearBtn" type="button">Clear form</button><button class="secondary" id="lockBtn" type="button">Lock admin page</button></div><div class="message" id="formMessage" role="status"></div></section>
<section class="panel"><h2>Rows for selected date</h2><div class="entry-list" id="entryList"><div class="muted">Load a date to view rows.</div></div></section>
</div></main>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbwvo4U_AKJUvXP_DPyZnRP8akMRHHhM94QyXzhrdEvNtYKapw2nmsJ-YSc12u34nW3O/exec';const $=id=>document.getElementById(id);let authorized=false;
function localDateString(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTime(v){const m=/^(\d{2}):(\d{2})$/.exec(v||'');if(!m)return v||'';let h=Number(m[1]);const ap=h>=12?'PM':'AM';h=h%12||12;return String(h).padStart(2,'0')+':'+m[2]+' '+ap;}
function setMessage(id,text,isError=false){$(id).textContent=text||'';$(id).style.color=isError?'#b91c1c':'#475569';}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='mySpaceAdminCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();};const timer=setTimeout(()=>{cleanup();reject(new Error('API request timed out. Check deployment and API URL.'));},15000);window[cb]=data=>{cleanup();resolve(data);};script.onerror=()=>{cleanup();reject(new Error('Could not reach API. Check deployment access settings.'));};script.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();document.head.appendChild(script);});}
function code(){return $('adminCode').value;}
async function api(params){const result=await jsonp(params);if(!result||result.ok!==true)throw new Error(result&&result.error?result.error:'Unexpected API response.');return result;}
async function unlock(){if(!code()){setMessage('authMessage','Enter the authorization code.',true);return;}$('unlockBtn').disabled=true;setMessage('authMessage','Checking authorization…');try{const date=localDateString();const result=await api({action:'adminList',code:code(),date});authorized=true;$('authPanel').classList.add('hidden');$('adminWorkspace').classList.remove('hidden');$('listDate').value=date;$('entryDate').value=date;renderEntries(result.entries||[]);setMessage('listMessage','Authorized. '+(result.entries||[]).length+' row(s) loaded.');}catch(err){setMessage('authMessage',err.message||'Authorization failed.',true);}finally{$('unlockBtn').disabled=false;}}
async function loadRows(){if(!authorized)return;const date=$('listDate').value;if(!date){setMessage('listMessage','Choose a date.',true);return;}$('entryList').innerHTML='<div class="muted">Loading…</div>';try{const result=await api({action:'adminList',code:code(),date});renderEntries(result.entries||[]);setMessage('listMessage',(result.entries||[]).length+' row(s) loaded.');}catch(err){setMessage('listMessage',err.message||'Could not load rows.',true);}}
function renderEntries(rows){if(!Array.isArray(rows)||!rows.length){$('entryList').innerHTML='<div class="muted">No schedule rows for this date.</div>';return;}rows=[...rows].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.start||'').localeCompare(String(b.start||''))||String(a.end||'').localeCompare(String(b.end||''))||String(a.topic||'').localeCompare(String(b.topic||'')));$('entryList').innerHTML=rows.map(row=>{const cls=String(row.status).toUpperCase()==='AVAILABLE'?'available':'busy';return `<div class="entry"><div><strong>${escapeHtml(formatTime(row.start))}–${escapeHtml(formatTime(row.end))}</strong><small>${escapeHtml(row.date)}</small></div><div class="topiccol"><strong>${escapeHtml(row.topic)}</strong><small>Activity / person</small></div><div class="statuscol status ${cls}">${escapeHtml(row.status)}</div><div class="rowactions actions" style="margin:0"><button class="secondary" type="button" data-edit="${escapeHtml(row.id)}">Edit</button><button class="danger" type="button" data-delete="${escapeHtml(row.id)}">Delete</button></div></div>`;}).join('');$('entryList').querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>editRow(rows.find(r=>r.id===btn.dataset.edit))));$('entryList').querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>deleteRow(btn.dataset.delete)));}
function editRow(row){if(!row)return;$('entryId').value=row.id;$('entryDate').value=row.date;$('start').value=row.start;$('end').value=row.end;$('topic').value=row.topic;$('status').value=row.status;$('formTitle').textContent='Edit schedule row';setMessage('formMessage','Editing selected row.');window.scrollTo({top:0,behavior:'smooth'});}
function clearForm(){ $('entryId').value='';$('entryDate').value=$('listDate').value||localDateString();$('start').value='';$('end').value='';$('topic').value='';$('status').value='AVAILABLE';$('formTitle').textContent='Add schedule row';setMessage('formMessage','');}
async function saveRow(){if(!authorized)return;const entry={id:$('entryId').value,date:$('entryDate').value,start:$('start').value,end:$('end').value,topic:$('topic').value.trim(),status:$('status').value};if(!entry.date||!entry.start||!entry.end||!entry.topic){setMessage('formMessage','Fill in date, start time, end time, and activity/person.',true);return;}if(entry.start>=entry.end){setMessage('formMessage','End time must be later than start time.',true);return;}$('saveBtn').disabled=true;setMessage('formMessage','Saving…');try{const result=await api({action:'adminSave',code:code(),...entry});setMessage('formMessage',result.message||'Saved.');$('listDate').value=entry.date;clearForm();await loadRows();}catch(err){setMessage('formMessage',err.message||'Save failed.',true);}finally{$('saveBtn').disabled=false;}}
async function deleteRow(id){if(!authorized||!confirm('Delete this schedule row?'))return;try{const result=await api({action:'adminDelete',code:code(),id});setMessage('listMessage',result.message||'Deleted.');await loadRows();}catch(err){setMessage('listMessage',err.message||'Delete failed.',true);}}
function lock(){authorized=false;$('adminCode').value='';$('adminWorkspace').classList.add('hidden');$('authPanel').classList.remove('hidden');$('entryList').innerHTML='<div class="muted">Load a date to view rows.</div>';setMessage('authMessage','Admin page locked.');clearForm();}
$('unlockBtn').addEventListener('click',unlock);$('adminCode').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});$('loadBtn').addEventListener('click',loadRows);$('listDate').addEventListener('change',loadRows);$('saveBtn').addEventListener('click',saveRow);$('clearBtn').addEventListener('click',clearForm);$('lockBtn').addEventListener('click',lock);
</script>
</body>
</html>
